# Every workflow action is pinned, so a fix or security update only arrives through these PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A new version waits a week before its PR, so a hijacked release is usually pulled first.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      actions:
        patterns: ['*']

  # Libraries and Gradle plugins from gradle/libs.versions.toml. Versions that only work
  # together share a group, so one PR tests them together.
  # Dependabot cannot update gradle/verification-metadata.xml, so these PRs fail CI until the
  # file is refreshed on the PR branch (CONTRIBUTING.md, "Dependency checksums"). The label says so.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels: ['dependencies', 'needs-checksums']
    groups:
      # Each KSP release is built for one Kotlin version.
      kotlin:
        patterns: ['org.jetbrains.kotlin:*', 'org.jetbrains.kotlin.*', 'com.google.devtools.ksp*']
      # JetBrains' lifecycle and navigation forks ship with Compose Multiplatform.
      compose-multiplatform:
        patterns: ['org.jetbrains.compose*', 'org.jetbrains.androidx.*']
      androidx:
        patterns: ['androidx.*']

  # The Firebase CLI distribute-firebase.yml sends builds with. Its lockfile is what CI installs.
  - package-ecosystem: npm
    directory: /tools/firebase
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      firebase-tools:
        patterns: ['*']
