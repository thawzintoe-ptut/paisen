name: Release

# A tag vX.Y.Z or vX.Y.Z-rc.N becomes a signed release. The checks run first through ci.yml,
# so a release never gets weaker checks than a pull request.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-tag-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Version and notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      kind: ${{ steps.version.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag and branch, for the version and branch checks
          persist-credentials: false
      # A release comes from main, or from a release/* branch for a hotfix.
      - name: The tag is on main or a release branch
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -qE '^ *origin/(main|release/.+)$' \
            || { echo "::error::$GITHUB_REF_NAME is not on main or a release/* branch"; exit 1; }
      - name: Version
        id: version
        run: scripts/release/version.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          KIND: ${{ steps.version.outputs.kind }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: scripts/release/notes.sh "$KIND" "$VERSION_NAME" > notes.md
      # Made here, in a job with no secrets, so the jobs that hold the Play key run no repo script.
      - name: Play release notes
        env:
          URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: scripts/release/play-notes.sh notes.md "$URL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: |
            notes.md
            whatsnew/
          if-no-files-found: error

  checks:
    needs: meta
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip-ios: true

  # The checks above skip iOS to keep a release short, so an IPA ships only when main's CI passed
  # both iOS checks on this commit. A tag pushed right after its commit waits for that run.
  ios-checks:
    name: iOS checks passed on main
    needs: meta
    if: vars.IOS_SIDELOAD_ENABLED == 'true' || (needs.meta.outputs.kind == 'beta' && vars.IOS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read
    steps:
      # Exact names: this release's own runs are called "checks / ...", and they skip iOS.
      - name: Wait for both iOS checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state() {
            gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              -f check_name="$1" -f filter=latest \
              --jq 'if .total_count == 0 then "missing" else (.check_runs[0].conclusion // "running") end'
          }
          for attempt in $(seq 80); do
            waiting=0
            for check in 'Link and build (iOS)' 'Test (iOS)'; do
              s=$(state "$check")
              case "$s" in
                success) ;;
                running) waiting=1 ;;
                # main's run shows up within seconds of the push; after 2 minutes there is none.
                missing)
                  [ "$attempt" -le 4 ] || { echo "::error::main's CI never ran '$check' on $GITHUB_SHA (an older commit, a release/* hotfix, or not the last commit of a push), so no IPA ships."; exit 1; }
                  waiting=1 ;;
                *) echo "::error::'$check' is $s on $GITHUB_SHA, so no IPA ships. Fix main and tag again."; exit 1 ;;
              esac
            done
            if [ "$waiting" = 0 ]; then
              echo "Both iOS checks passed on $GITHUB_SHA."
              exit 0
            fi
            sleep 30
          done
          echo "::error::main's iOS checks on $GITHUB_SHA did not finish in 40 minutes, so no IPA ships."
          exit 1

  build:
    needs: [meta, checks]
    permissions:
      contents: read
      id-token: write # build provenance for the APK and AAB
      attestations: write
    uses: ./.github/workflows/build-signed.yml
    with:
      version-name: ${{ needs.meta.outputs.name }}
      version-code: ${{ needs.meta.outputs.code }}

  # Off until the Apple Developer Program is paid and the signing secrets are in `release`. Only
  # the iPhones in the ad hoc profile can install it, so it goes to App Distribution, not GitHub.
  build-ios:
    needs: [meta, checks, ios-checks]
    if: needs.meta.outputs.kind == 'beta' && vars.IOS_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write # build provenance for the IPA
      attestations: write
    uses: ./.github/workflows/build-ios.yml
    with:
      version-name: ${{ needs.meta.outputs.name }}
      version-code: ${{ needs.meta.outputs.code }}
      signing: ad-hoc

  # The free way onto an iPhone: an unsigned IPA on the GitHub release, which each tester signs with
  # their own Apple ID in SideStore or AltStore. Off until IOS_SIDELOAD_ENABLED is true.
  build-ios-sideload:
    needs: [meta, checks, ios-checks]
    if: vars.IOS_SIDELOAD_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write # build provenance for the IPA
      attestations: write
    uses: ./.github/workflows/build-ios.yml
    with:
      version-name: ${{ needs.meta.outputs.name }}
      version-code: ${{ needs.meta.outputs.code }}
      signing: none

  github-release:
    name: GitHub release
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PaiSeN-${{ needs.meta.outputs.name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      # A re-run replaces the APK on the release that already exists, never makes a second one.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.meta.outputs.name }}
          KIND: ${{ needs.meta.outputs.kind }}
        run: |
          apk="PaiSeN-$NAME.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          elif [ "$KIND" = beta ]; then
            gh release create "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --verify-tag --title "PaiSeN $NAME" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --verify-tag --title "PaiSeN $NAME" --notes-file notes.md
          fi

  # After github-release, so the APK is out even when the iPhone build fails.
  github-release-ios:
    name: GitHub release (iPhone IPA)
    needs: [meta, github-release, build-ios-sideload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PaiSeN-ios-none-${{ needs.meta.outputs.name }}
      - name: Add the IPA to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.meta.outputs.name }}
        run: gh release upload "$TAG" "PaiSeN-$NAME.ipa" --clobber --repo "$GITHUB_REPOSITORY"

  # The switches below are repository variables: a job's `if` is read before it enters its
  # environment, so environment variables are not visible there.
  firebase:
    name: Firebase App Distribution (Android)
    needs: [meta, build]
    if: needs.meta.outputs.kind == 'beta' && vars.FIREBASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PaiSeN-${{ needs.meta.outputs.name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # A release restores no cache another run could have written.
          package-manager-cache: false
      # The app id comes from firebase.properties, so it is not a second secret to keep in step.
      - name: Send the APK to the testers group
        env:
          FIREBASE_DISTRIBUTION_SA_JSON: ${{ secrets.FIREBASE_DISTRIBUTION_SA_JSON }}
          FIREBASE_PROPERTIES: ${{ secrets.FIREBASE_PROPERTIES }}
          NAME: ${{ needs.meta.outputs.name }}
        run: |
          app_id=$(printf '%s\n' "$FIREBASE_PROPERTIES" | sed -n 's/^androidAppId=//p' | tr -d '\r')
          [ -n "$app_id" ] || { echo "::error::androidAppId is missing from FIREBASE_PROPERTIES"; exit 1; }
          printf '%s' "$FIREBASE_DISTRIBUTION_SA_JSON" > "$RUNNER_TEMP/distribution.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/distribution.json" npx --yes firebase-tools@15.34.0 \
            appdistribution:distribute "PaiSeN-$NAME.apk" --app "$app_id" --groups testers --release-notes-file notes.md
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/distribution.json"

  # Skipped whenever build-ios is, so IOS_ENABLED switches this one too.
  firebase-ios:
    name: Firebase App Distribution (iOS)
    needs: [meta, build-ios]
    if: vars.FIREBASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PaiSeN-ios-ad-hoc-${{ needs.meta.outputs.name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # A release restores no cache another run could have written.
          package-manager-cache: false
      # The app id comes from the plist the build already uses, so it is not a second secret.
      - name: Send the IPA to the testers group
        env:
          FIREBASE_DISTRIBUTION_SA_JSON: ${{ secrets.FIREBASE_DISTRIBUTION_SA_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          NAME: ${{ needs.meta.outputs.name }}
        run: |
          app_id=$(printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" | grep -A1 '<key>GOOGLE_APP_ID</key>' \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          [ -n "$app_id" ] || { echo "::error::GOOGLE_APP_ID is missing from GOOGLE_SERVICE_INFO_PLIST"; exit 1; }
          printf '%s' "$FIREBASE_DISTRIBUTION_SA_JSON" > "$RUNNER_TEMP/distribution.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/distribution.json" npx --yes firebase-tools@15.34.0 \
            appdistribution:distribute "PaiSeN-$NAME.ipa" --app "$app_id" --groups testers --release-notes-file notes.md
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/distribution.json"

  play-beta:
    name: Play testing track
    needs: [meta, build]
    if: needs.meta.outputs.kind == 'beta' && vars.PLAY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      # A beta may only reach a testing track; production goes through play-production's approval.
      - name: The track is a testing track
        env:
          TRACK: ${{ vars.PLAY_BETA_TRACK || 'internal' }}
        run: |
          case "$TRACK" in
            internal|alpha|beta) ;;
            *) echo "::error::PLAY_BETA_TRACK is '$TRACK'; it must be internal, alpha or beta"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PaiSeN-${{ needs.meta.outputs.name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      # PLAY_STATUS stays draft until the app has been published once; Play refuses anything
      # else for a draft app.
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ptut.expense
          releaseFiles: PaiSeN-${{ needs.meta.outputs.name }}.aab
          releaseName: ${{ needs.meta.outputs.name }}
          track: ${{ vars.PLAY_BETA_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'draft' }}
          whatsNewDirectory: whatsnew

  play-production:
    name: Play production (20%)
    needs: [meta, build]
    if: needs.meta.outputs.kind == 'production' && vars.PLAY_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The production environment's required reviewer is what makes this job wait for approval.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PaiSeN-${{ needs.meta.outputs.name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ptut.expense
          releaseFiles: PaiSeN-${{ needs.meta.outputs.name }}.aab
          releaseName: ${{ needs.meta.outputs.name }}
          track: production
          status: inProgress
          userFraction: 0.2
          whatsNewDirectory: whatsnew
