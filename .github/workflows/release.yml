name: Release

# A tag vX.Y.Z or vX.Y.Z-rc.N becomes a signed release. The checks run first through ci.yml,
# so a release never gets weaker checks than a pull request.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-tag-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Version and notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      kind: ${{ steps.version.outputs.kind }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # every tag and branch, for the version and branch checks
      # A release comes from main, or from a release/* branch for a hotfix.
      - name: The tag is on main or a release branch
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -qE '^ *origin/(main|release/.+)$' \
            || { echo "::error::$GITHUB_REF_NAME is not on main or a release/* branch"; exit 1; }
      - name: Version
        id: version
        run: scripts/release/version.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          KIND: ${{ steps.version.outputs.kind }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: scripts/release/notes.sh "$KIND" "$VERSION_NAME" > notes.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  checks:
    needs: meta
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip-ios: true

  build:
    needs: [meta, checks]
    permissions:
      contents: read
    uses: ./.github/workflows/build-signed.yml
    secrets: inherit
    with:
      version-name: ${{ needs.meta.outputs.name }}
      version-code: ${{ needs.meta.outputs.code }}

  github-release:
    name: GitHub release
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: PaiSeN-${{ needs.meta.outputs.name }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: notes
      # A re-run replaces the APK on the release that already exists, never makes a second one.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.meta.outputs.name }}
          KIND: ${{ needs.meta.outputs.kind }}
        run: |
          apk="PaiSeN-$NAME.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          elif [ "$KIND" = beta ]; then
            gh release create "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --verify-tag --title "PaiSeN $NAME" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --verify-tag --title "PaiSeN $NAME" --notes-file notes.md
          fi

  # The switches below are repository variables: a job's `if` is read before it enters its
  # environment, so environment variables are not visible there.
  firebase:
    name: Firebase App Distribution
    needs: [meta, build]
    if: needs.meta.outputs.kind == 'beta' && vars.FIREBASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: PaiSeN-${{ needs.meta.outputs.name }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: notes
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      # The app id comes from firebase.properties, so it is not a second secret to keep in step.
      - name: Send the APK to the testers group
        env:
          FIREBASE_DISTRIBUTION_SA_JSON: ${{ secrets.FIREBASE_DISTRIBUTION_SA_JSON }}
          FIREBASE_PROPERTIES: ${{ secrets.FIREBASE_PROPERTIES }}
          NAME: ${{ needs.meta.outputs.name }}
        run: |
          app_id=$(printf '%s\n' "$FIREBASE_PROPERTIES" | sed -n 's/^androidAppId=//p' | tr -d '\r')
          [ -n "$app_id" ] || { echo "::error::androidAppId is missing from FIREBASE_PROPERTIES"; exit 1; }
          printf '%s' "$FIREBASE_DISTRIBUTION_SA_JSON" > "$RUNNER_TEMP/distribution.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/distribution.json" npx --yes firebase-tools@15.34.0 \
            appdistribution:distribute "PaiSeN-$NAME.apk" --app "$app_id" --groups testers --release-notes-file notes.md
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/distribution.json"

  play-beta:
    name: Play testing track
    needs: [meta, build]
    if: needs.meta.outputs.kind == 'beta' && vars.PLAY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: PaiSeN-${{ needs.meta.outputs.name }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: notes
      - name: Play release notes
        env:
          URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: scripts/release/play-notes.sh notes.md "$URL"
      # PLAY_BETA_TRACK is internal, or alpha during the closed test. PLAY_STATUS stays draft
      # until the app has been published once; Play refuses anything else for a draft app.
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ptut.expense
          releaseFiles: PaiSeN-${{ needs.meta.outputs.name }}.aab
          releaseName: ${{ needs.meta.outputs.name }}
          track: ${{ vars.PLAY_BETA_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'draft' }}
          whatsNewDirectory: whatsnew

  play-production:
    name: Play production (20%)
    needs: [meta, build]
    if: needs.meta.outputs.kind == 'production' && vars.PLAY_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The production environment's required reviewer is what makes this job wait for approval.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: PaiSeN-${{ needs.meta.outputs.name }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: notes
      - name: Play release notes
        env:
          URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: scripts/release/play-notes.sh notes.md "$URL"
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ptut.expense
          releaseFiles: PaiSeN-${{ needs.meta.outputs.name }}.aab
          releaseName: ${{ needs.meta.outputs.name }}
          track: production
          status: inProgress
          userFraction: 0.2
          whatsNewDirectory: whatsnew
