name: Cut release

# Nobody numbers a release by hand. A push to main whose CI passed, and that holds a feat: or
# fix:, becomes the next release candidate; Run workflow cuts production from the latest
# candidate, on that candidate's own commit. scripts/release/next-version.sh picks the number.
#
# The tag starts release.yml by dispatch: a tag pushed with GITHUB_TOKEN starts no workflow, a
# workflow_dispatch does. No ruleset blocks creating a v* tag, since a personal account's repo
# can't let GitHub Actions bypass one; "release tags locked" keeps moving and deleting for admins.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'What to cut'
        type: choice
        options: [production, candidate]
        default: production
      bump:
        description: 'Candidate only: follow the commits, or force a major, minor or patch bump'
        type: choice
        options: [commits, major, minor, patch]
        default: commits

permissions: {}

# One cut at a time, in order: two runs must never pick the same number.
concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Tag and release
    # Only CI runs for pushes to main: a pull request's run, even a passing one, never tags.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag
      actions: write # start release.yml on it
      checks: read # a candidate by hand: did CI fail on this commit?
    steps:
      # Releases come from main or a release/* hotfix line, never a feature branch or a tag.
      - name: Check the branch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main | refs/heads/release/*) ;;
            *) echo "::error::Cut release runs from main or a release/* branch, not ${REF#refs/*/}."; exit 1 ;;
          esac

      # The commit CI passed on, not main's tip: a later push has not been checked yet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # every commit and tag, for what changed since the last release
          persist-credentials: false

      - name: Pick the tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release }}
          BUMP: ${{ inputs.bump }}
        run: |
          args=()
          if [ "$EVENT" = workflow_run ]; then
            # A run that finished after a newer commit was tagged must not tag backwards.
            if [ -n "$(git tag -l 'v*' --contains HEAD)" ]; then
              echo "A release already holds this commit." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            args=(--auto)
          elif [ "$RELEASE" = production ]; then
            args=(--final)
          else
            # A candidate by hand: a commit CI failed on would burn a version number on a build that
            # fails its own checks. No run yet (a release/* branch) is fine: Release runs them.
            android=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/check-runs" \
              -f check_name='Build and test (Android)' -f filter=latest --jq '.check_runs[0].conclusion // ""')
            if [ -n "$android" ] && [ "$android" != success ]; then
              echo "::error::CI is '$android' on this commit, so no candidate is cut from it."
              exit 1
            fi
            [ "$BUMP" = commits ] || args=(--bump "$BUMP")
          fi
          status=0
          tag=$(scripts/release/next-version.sh "${args[@]}" 2> why.txt) || status=$?
          cat why.txt
          case "$status" in
            0) ;;
            3) { echo "Nothing to release: $(head -1 why.txt)"; } >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            *) echo "::error::$(head -1 why.txt)"; exit 1 ;;
          esac
          # Production ships the candidate testers had, so its tag goes on that candidate's commit.
          if [ "$RELEASE" = production ] && [ "$EVENT" = workflow_dispatch ]; then
            target=$(git rev-list -n 1 "$(scripts/release/next-version.sh --latest)")
          else
            target=$(git rev-parse HEAD)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Create the tag
        if: steps.pick.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
          TARGET: ${{ steps.pick.outputs.target }}
        run: |
          # Someone tagged by hand since this run picked the number: say where, rather than a bare 422.
          if held=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2> /dev/null); then
            echo "::error::$TAG already exists (tag object ${held:0:7}). Run Cut release again for the next number."
            exit 1
          fi
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="$TAG" \
            -f object="$TARGET" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null \
            || { echo "::error::$TAG was refused. Does a tag ruleset block creating v* tags? Only moving and deleting should be blocked."; exit 1; }
          echo "Tagged \`$TAG\` on ${TARGET:0:7}." >> "$GITHUB_STEP_SUMMARY"

      - name: Start the release
        if: steps.pick.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          # The tag stands either way; a release that did not start is one click from here.
          if ! gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"; then
            echo "Release did not start. Start it by hand: Actions → Release → Run workflow → Use workflow from: tag \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$TAG exists but Release did not start. Actions → Release → Run workflow → Use workflow from: $TAG"
            exit 1
          fi
          echo "Started **Release** on \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
