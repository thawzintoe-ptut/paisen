name: Pull Request

# Trunk-based: every push to main must stay green, and every short-lived branch is
# checked before it merges back. The tests run in unit-tests.yml, side by side with this.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip-ios:
        description: 'True for an Android-only release'
        type: boolean
        default: false

# The release workflows call this file too, and give it the same read-only token.
permissions:
  contents: read

# A new push replaces a pull request's run. On main each commit has its own group, because a
# shared group still cancels a waiting run when a third one arrives.
concurrency:
  # Called from a release, github.workflow is the caller's name; the prefix keeps checks and tests apart.
  group: checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-rules:
    name: Source rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Gradle daemon runs on 21 (gradle/gradle-daemon-jvm.properties); the code still targets 17.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # pre-push can be skipped with --no-verify, so the source rules are re-checked here.
      # Unqualified task names run in every module that has the task.
      - run: ./gradlew verifySourceRules
      # A feature reads :data through its repositories, never its Room types.
      - run: ./gradlew verifyFeatureImports
      # NFR-5: no account number reaches the repo inside a slip transcript.
      - run: ./gradlew verifyNoAccountNumbers
      # A comma in a backtick test name compiles here and breaks the iOS target.
      - run: ./gradlew verifyNativeNames
      # #191: no banned HTTP client or telemetry SDK on a shipped classpath (Ktor is for sync/).
      - run: ./gradlew :composeApp:verifyNoNetworkDependencies :androidApp:verifyNoNetworkDependencies
      # #191: the merged manifest keeps no telemetry upload backend.
      - run: ./gradlew :androidApp:verifyNoTelemetryUpload
      # Bundled fonts reach Android only as merged assets; a missing one draws the system face.
      - run: ./gradlew :androidApp:verifyBundledResources
      # #22: a badly formatted file fails here. No git hook runs it, so commit and push stay fast.
      - run: ./gradlew spotlessCheck
      # The release number and notes come from the commit titles; their rules are checked on throwaway repos.
      - run: for test in scripts/release/*.test.sh; do "$test"; done

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :androidApp:assembleDebug
      # R8 runs only in a release build. Without the upload key the APK stays unsigned, so a
      # missing keep rule fails on the commit that breaks it, not on tag day.
      - run: ./gradlew :androidApp:assembleRelease
      # Fails on a new lint error; androidApp/lint-baseline.xml holds the old findings. The KMP
      # library modules have no working lint task on AGP 9 yet (KMT-1196), so this is the app only.
      - run: ./gradlew :androidApp:lintDebug
      - name: Keep the lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report-${{ github.job }}-${{ github.run_attempt }}
          path: androidApp/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

  ios-app:
    name: Link and build (iOS)
    # On a push or pull request the input is empty, so iOS runs; an Android release skips it.
    if: inputs.skip-ios != true
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same Xcode as the Mac that builds releases. The image's default can change without notice.
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Kotlin/Native keeps its toolchain and compiler caches here, outside Gradle's cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      # The slow one. Kept off the pre-push hook on purpose so committing stays cheap.
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
      # Xcode copies GoogleService-Info.plist into the app, and the real one is gitignored. A build
      # only needs the file to exist, so CI writes an empty one and no Firebase value reaches GitHub.
      - run: test -f iosApp/iosApp/GoogleService-Info.plist || plutil -create xml1 iosApp/iosApp/GoogleService-Info.plist
      # Swift calls Kotlin by name, and moving a file to another module can change the name.
      # Linking the framework never compiles Swift; this does. ARCHS=arm64: the Gradle embed
      # task builds no x86_64 simulator slice.
      - run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/dd ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

  # The tag the next release would take, in this run's summary, so nobody works it out by hand.
  # Read-only: it tags nothing, and it is not a required check.
  next-release:
    name: Next release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit and tag, for what changed since the last release
          persist-credentials: false
      - name: Next release tag
        run: |
          {
            echo "### Next release"
            if next=$(scripts/release/next-version.sh 2> why.txt); then
              echo "- Candidate: \`$next\` ($(head -1 why.txt))"
            else
              echo "- Candidate: none, $(head -1 why.txt)"
            fi
            if final=$(scripts/release/next-version.sh --final 2> why.txt); then
              echo "- Production: \`$final\` ($(head -1 why.txt))"
            else
              echo "- Production: not yet, $(head -1 why.txt | sed 's/:$//')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
