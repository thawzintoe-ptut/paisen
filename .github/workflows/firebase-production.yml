name: Deploy Production Build to Firebase

# Sends a production release's APK to the Firebase testers group again, by hand: Run workflow → Use
# workflow from: the vX.Y.Z tag. It takes the APK from the GitHub release and checks its build
# provenance, so testers get the same bytes as the release and nothing is rebuilt. Production
# Release sends its own build the first time.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: firebase-production-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Release APK and notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      name: ${{ steps.tag.outputs.name }}
    steps:
      - name: The ref is a production tag
        id: tag
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::Run this on a vX.Y.Z tag, not the branch $GITHUB_REF_NAME"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not a production tag vX.Y.Z"; exit 1; }
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Download the APK and the notes
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "PaiSeN-$NAME.apk"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
      # The file on the release could have been replaced by hand; only a build this repository's
      # release run made for this tag goes out.
      - name: Check the build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.tag.outputs.name }}
        run: >-
          gh attestation verify "PaiSeN-$NAME.apk" --repo "$GITHUB_REPOSITORY"
          --source-ref "refs/tags/$GITHUB_REF_NAME"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-signed.yml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaiSeN-${{ steps.tag.outputs.name }}
          path: PaiSeN-${{ steps.tag.outputs.name }}.apk
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          retention-days: 1
          if-no-files-found: error

  firebase:
    needs: fetch
    permissions:
      contents: read
    uses: ./.github/workflows/distribute-firebase.yml
    # The release environment's secrets reach a called workflow only through inherit.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      platform: android
      version-name: ${{ needs.fetch.outputs.name }}
