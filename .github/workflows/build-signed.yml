name: Signed build

# US-3: a signed APK and AAB, kept as workflow artifacts for 7 days. Nothing is published.
# Run by hand it uses versionCode 1, which Play already holds, so Play refuses the upload.
# release.yml calls it with the tag's version.
on:
  workflow_dispatch:
    inputs:
      version-name:
        description: 'versionName, for example 0.1.0-rc.1. Empty: the last tag plus "-dev".'
        required: false
        default: ''
  workflow_call:
    inputs:
      version-name:
        type: string
        required: true
      version-code:
        type: string
        required: true

permissions: {}

concurrency:
  group: signed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Signed APK and AAB
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the default version name
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Version name
        id: version
        env:
          INPUT_NAME: ${{ inputs.version-name }}
        run: |
          name="$INPUT_NAME"
          if [ -z "$name" ]; then
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
            name="${last#v}-dev"
          fi
          if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$name' is not a version like 0.1.0 or 0.1.0-rc.1"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The keystore lives in the runner's temp folder, never in the checkout.
      - name: Upload key and Firebase settings
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          FIREBASE_PROPERTIES: ${{ secrets.FIREBASE_PROPERTIES }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf '%s\n' "$FIREBASE_PROPERTIES" > firebase.properties

      - name: Build
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ inputs.version-code || '1' }}
          PAISEN_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          PAISEN_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          PAISEN_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          PAISEN_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: >-
          ./gradlew :androidApp:verifyNoTelemetryUpload :androidApp:verifyNoNetworkDependencies
          :androidApp:assembleRelease :androidApp:bundleRelease
          -PpaisenVersionName="$VERSION_NAME" -PpaisenVersionCode="$VERSION_CODE"

      # Signed with the right key, or nothing is kept.
      - name: Check the signing certificate
        env:
          UPLOAD_CERT_SHA256: ${{ vars.UPLOAD_CERT_SHA256 }}
        run: |
          apk=$(find androidApp/build/outputs/apk/release -name '*.apk')
          [ "$(printf '%s\n' "$apk" | wc -l)" -eq 1 ] || { echo "::error::expected one release APK, found: $apk"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          expected=$(printf '%s' "$UPLOAD_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK certificate is '$actual', expected '$expected'"
            exit 1
          fi

      - name: Name the files
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p out
          cp "$(find androidApp/build/outputs/apk/release -name '*.apk')" "out/PaiSeN-$VERSION_NAME.apk"
          cp "$(find androidApp/build/outputs/bundle/release -name '*.aab')" "out/PaiSeN-$VERSION_NAME.aab"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaiSeN-${{ steps.version.outputs.name }}
          path: out/
          retention-days: 7
          if-no-files-found: error

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" firebase.properties
