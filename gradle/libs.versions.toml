[versions]
# Kotlin is held at 2.3.x deliberately: KSP has no 2.4.x build yet and Room needs KSP.
kotlin = "2.3.21"
ksp = "2.3.11"
agp = "9.2.1"
composeMultiplatform = "1.11.1"

androidCompileSdk = "37"
androidMinSdk = "26"
androidTargetSdk = "37"

androidxActivityCompose = "1.13.0"
# JetBrains republishes lifecycle and navigation for multiplatform under org.jetbrains.androidx.
# Their version lines differ from Google's — navigation tops out at 2.9.2, not 2.9.8.
androidxLifecycle = "2.11.0"
androidxNavigation = "2.9.2"
androidxMaterial3Adaptive = "1.3.0"
androidxWork = "2.11.2"

room = "2.8.4"
sqlite = "2.7.0"

koin = "4.2.2"
coroutines = "1.11.0"
datetime = "0.8.0"
serialization = "1.11.0"

mlkitTextRecognition = "16.0.1"

okio = "3.9.1"

# #191: shared groups sync over Firebase's REST APIs. Ktor's client is allowed under sync/ only.
ktor = "3.6.0"
androidxCredentials = "1.6.0"
googleId = "1.2.1"
firebaseMessaging = "25.1.3"
# #190: draws the invite QR code. Pure Compose, no camera. Held at 1.1.1: 1.2.0 and later ship
# iOS klibs built with Kotlin 2.4 (ABI 2.4.0), which this Kotlin 2.3 build cannot read.
qrose = "1.1.1"
# #213: Gemini calls these on Android 16+. Alpha, and debug builds only until Google's Early Access
# Program says yes; a release build carries none of it.
androidxAppFunctions = "1.0.0-alpha13"

turbine = "1.2.1"

# Build-time only: the format check never reaches a shipped classpath.
spotless = "8.9.0"
ktlint = "1.8.0"

[libraries]
# Compose / lifecycle
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
# #214: back and the iOS edge swipe ask before a changed form closes.
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
androidx-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "androidxMaterial3Adaptive" }

# Database
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# DI
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Platform OCR (Android only; iOS uses Apple Vision via cinterop-free direct API)
# NFR-1: this is the bundled-model artifact. Its Play-services sibling,
# com.google.android.gms:play-services-mlkit-text-recognition, downloads the model on first
# use — swapping to it would put the app on the network and break the Settings promise.
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }

# Android background import
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }

# Hashing. F3 tier one is the SHA-256 of the image bytes, and nothing else on the classpath
# can compute one. Chosen over a hand-rolled digest: this is identity, but a hand-rolled
# primitive is still the kind of code nobody reviews twice.
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

# Shared groups (#187–#190)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidxCredentials" }
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }
# Shared-group push only; no BoM and no Google Services plugin (FirebaseOptions come from firebase.properties).
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }

# Gemini actions (#213)
androidx-appfunctions = { module = "androidx.appfunctions:appfunctions", version.ref = "androidxAppFunctions" }
androidx-appfunctions-compiler = { module = "androidx.appfunctions:appfunctions-compiler", version.ref = "androidxAppFunctions" }

# Test
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
# AGP 9 forbids com.android.application in a module that also applies the KMP plugin.
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
