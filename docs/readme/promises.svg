<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Three promises</title>
  <desc id="desc">1. On the phone: slips are read by ML Kit and Apple Vision, and nothing is uploaded. 2. No account: your own spending needs no sign-in, ads or analytics. 3. Nothing lost: a slip it cannot read waits in To check with its picture.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .card { fill: #F1F3F5; }
    .dot { fill: #A9DCF7; }
    .num { font-size: 15px; font-weight: 700; fill: #0B0B0C; }
    .title { font-size: 25px; font-weight: 700; letter-spacing: -0.4px; fill: #0B0B0C; }
    .body { font-size: 15.5px; fill: #4E565C; }
  </style>

  <g>
    <rect class="card" x="0" width="416" height="200" rx="32"/>
    <circle class="dot" cx="52" cy="56" r="20"/>
    <text class="num" x="52" y="61.5" text-anchor="middle">1</text>
    <text class="title" x="32" y="122">On the phone</text>
    <text class="body" x="32" y="154">Slips are read by ML Kit and</text>
    <text class="body" x="32" y="176">Apple Vision. Nothing is uploaded.</text>
  </g>
  <g transform="translate(432 0)">
    <rect class="card" x="0" width="416" height="200" rx="32"/>
    <circle class="dot" cx="52" cy="56" r="20"/>
    <text class="num" x="52" y="61.5" text-anchor="middle">2</text>
    <text class="title" x="32" y="122">No account</text>
    <text class="body" x="32" y="154">Your own spending needs no</text>
    <text class="body" x="32" y="176">sign-in, ads or analytics.</text>
  </g>
  <g transform="translate(864 0)">
    <rect class="card" x="0" width="416" height="200" rx="32"/>
    <circle class="dot" cx="52" cy="56" r="20"/>
    <text class="num" x="52" y="61.5" text-anchor="middle">3</text>
    <text class="title" x="32" y="122">Nothing lost</text>
    <text class="body" x="32" y="154">A slip it cannot read waits</text>
    <text class="body" x="32" y="176">in To check with its picture.</text>
  </g>
</svg>
